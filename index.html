.dots{position:absolute;bottom:.9rem;left:0;right:0;display:flex;justify-content:center;gap:.5rem}
.dots button{width:11px;height:11px;padding:0;border-radius:50%;background:rgba(255,255,255,.65);border:0}.dots button.on{background:var(--brass)}
@media(max-width:720px){.slider{max-width:300px;border-radius:150px 150px 20px 20px}}
header b::before{content:none}
header b a{display:flex;align-items:center;gap:.7rem}header b a span{font-size:1.05rem}
.lg{height:44px;width:auto;background:#fff;border-radius:10px;padding:4px 10px}
.lgf{display:block;height:52px;width:auto;margin:0 auto 1rem}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== 1. PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) ===== */
const SB_URL='https://dqsdlprzlszsrrgmvihw.supabase.co', SB_KEY='sb_publishable_d-wqDxt2tpgyjd81-RWqsQ_VdT2St2J';
const RATE=0.05; // FIXERZ commission on eligible labour and service fees
/* ======================================================================= */
let RECOVERY=/type=recovery/.test(location.hash);
const db=supabase.createClient(SB_URL.startsWith('http')?SB_URL:'https://x.supabase.co',SB_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG');
const LBL={submitted:'Under review',contacted:'Contacted',in_progress:'In progress',completed:'Completed',not_proceeding:'Not proceeding'};
const MS0=[{needed:30,reward:'Exclusive VIP recognition and reward'}];
const INC=[['Monthly','every month','Referral Partner of the Month'],['Yearly','every year','Annual top referrer awards'],['Birthday','your special day','Birthday reward'],['Events','VIP access','Exclusive invitations to Casa Vanté events']];
const ref=new URLSearchParams(location.search).get('ref');
let user=null,isAdmin=false,REFS=[],UNPAID=false,AN='';
const pw=(n,l,m)=>`<label>${l}<span class="pw"><input name="${n}" type="password" ${m?'minlength="'+m+'"':''} required autocomplete="${m?'new-password':'current-password'}"><button type="button" class="eye" onclick="eye(this)">Show</button></span></label>`;
const eye=b=>{const i=b.previousElementSibling,h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show'};
const key=s=>String(s||'').replace(/\D/g,'').slice(-10);
async function banner(){try{const{data}=await db.from('announcement').select('message').single();AN=data?.message||''}catch{AN=''}}
const ok=(t)=>`<p class="msg">${t}</p>`,bad=(t)=>`<p class="msg err">${e(t)}</p>`;
const win=r=>r.status==='completed'&&r.paid_in_full;
async function milestones(){try{const{data}=await db.from('milestones').select().order('needed');return data?.length?data:MS0}catch{return MS0}}
async function boot(){
  const{data}=await db.auth.getSession();user=data.session?.user||null;isAdmin=false;if(RECOVERY&&user){RECOVERY=false;history.replaceState(null,'',location.pathname+'#newpw')}
  if(user){const r=await db.rpc('is_admin');isAdmin=!!r.data}
  route();
}
function route(){
  const v=location.hash.slice(1)||'home';
  $('#nav').innerHTML=(isAdmin?[['home','Home'],['how','How It Works'],['admin','Admin Dashboard']]:user?[['home','Home'],['how','How It Works'],['dashboard','My Dashboard']]:[['home','Home'],['how','How It Works'],['join','Become a Partner'],['login','Partner Login']])
    .map(([k,t])=>`<a href="#${k}" class="${k===v?'on':''}">${t}</a>`).join('')
    +(user?'<a href="#" onclick="out();return false">Sign out</a>':'');
  window.scrollTo(0,0);(V[v]||V.home)();
}
async function out(){await db.auth.signOut();location.hash='home';boot()}
addEventListener('hashchange',route);

const V={
async home(){
  const ms=await milestones();
  app.innerHTML=`<section class="hero2"><div><span class="pill">Casa Vanté Referral Network</span><h1>Know someone who needs a beautiful home? <em>Earn</em> when we deliver it.</h1>
  <p>Join the Casa Vanté Referral Network, share your personal code, and earn a commission when your referral’s job is completed and fully paid.</p>
  <a class="btn" href="#join">Become a partner</a> <button class="alt" onclick="location.hash='how'">How it works</button> <a class="alt-link" href="#login">Partner login</a></div>
  <div class="slider" id="sl"><img src="images/1.jpg" alt="Casa Vanté team members holding a branded hard hat" class="on" style="object-position:center 65%"><img src="images/2.jpg" alt="Two Casa Vanté team members in branded hard hats and shirts" style="object-position:center 25%"><div class="dots"><button type="button" class="on" aria-label="Show photo 1"></button><button type="button" aria-label="Show photo 2"></button></div></div></section>
  ${ref?`<div class="box"><h2>Tell us what you need</h2><p>You were referred by partner <b>${e(ref)}</b>. Leave your details and our team will call you.</p>
  <form id="lead"><label>Your name<input name="n" required></label><label>Phone number<input name="p" type="tel" required></label>
  <label>What do you need? (optional)<input name="x"></label><button>Request a call</button></form><div id="m"></div></div>`:''}
  <div class="grid f"><div class="box c1"><h3>5% commission</h3><p>On eligible labour and service fees from every successful referral.</p></div>
  <div class="box c2"><h3>Milestone rewards</h3><p>Reach 30 successful referrals for exclusive VIP recognition and a reward.</p></div>
  <div class="box c3"><h3>Track everything</h3><p>See every referral, commission and reward in your own dashboard.</p></div></div>
  <h2 class="mid">Rewards and recognition</h2><div class="rw">${ms.map(m=>`<div class="r0"><b>${m.needed}</b><span>successful referrals</span><p>${e(m.reward)}</p></div>`).join('')}${INC.map((x,i)=>`<div class="r${(i+1)%4}"><b class="sm">${x[0]}</b><span>${x[1]}</span><p>${x[2]}</p></div>`).join('')}</div>
  <h2 class="mid">Four easy steps</h2><div class="strip"><div><b>1</b>Join free<br><small>Approved instantly</small></div><div><b>2</b>Get your code<br><small>Your own link too</small></div><div><b>3</b>Refer a customer<br><small>Share or submit</small></div><div><b>4</b>Earn your reward<br><small>When the job is paid</small></div></div>
  <div class="cta"><div><h2>Ready to start earning?</h2><p>Registering takes about a minute.</p></div><a class="btn" href="#join">Become a partner</a></div>`;
  slider();$('#lead')&&($('#lead').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);
    const{error}=await db.rpc('submit_lead',{p_code:ref,p_name:f.get('n'),p_phone:f.get('p'),p_notes:f.get('x')});
    $('#m').innerHTML=error?bad('We could not send your request. Please check the link and try again.'):ok('Thank you. Our team will contact you shortly.');if(!error)ev.target.reset()});
},
async how(){
  const ms=await milestones();
  app.innerHTML=`<h2>How it works</h2><ol class="steps"><li><b>Join the network.</b> Fill in the short registration form. You are approved instantly.</li>
  <li><b>Get a referral code.</b> Every approved partner gets a unique code and link.</li>
  <li><b>Refer a customer.</b> Share your link, or submit the customer’s name and phone number yourself.</li>
  <li><b>We handle the job.</b> Our team contacts the customer, discusses the service and does the work.</li>
  <li><b>Earn your commission.</b> When the job is completed and full payment is received, you earn your commission.</li></ol>
  <h3>Commission</h3><p>FIXERZ partners earn <b>5%</b> of eligible labour and service fees. Materials and reimbursable expenses are excluded. Commission is earned only after the job is completed and the customer has paid in full. All commissions are verified and approved by Casa Vanté.</p>
  <h3>Milestone rewards</h3><div class="tw"><table><tr><th>Successful referrals</th><th>Reward</th></tr>${ms.map(m=>`<tr><td>${m.needed}</td><td>${e(m.reward)}</td></tr>`).join('')}</table></div>
  <h3>Recognition and awards</h3><ul><li>Referral Partner of the Month</li><li>Annual top referrer awards</li><li>Birthday reward</li><li>Exclusive invitations to Casa Vanté events</li></ul><p>Only verified, successful referrals count towards the milestone. Rewards are approved by our team and never issued automatically.</p>`;
},
join(){
  app.innerHTML=`<h2>Become a partner</h2><form id="f"><label>Full name<input name="name" required></label><label>Phone number<input name="phone" type="tel" required></label>
  <label>Email<input name="email" type="email" required></label><label>City<input name="city"></label><label>Birthday (for your birthday reward)<input name="birthday" type="date"></label>
  ${pw('pw','Choose a password',6)}<button>Join the network</button></form><div id="m"></div>`;
  $('#f').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));
    const{data,error}=await db.auth.signUp({email:f.email,password:f.pw,options:{data:{name:f.name,phone:f.phone,city:f.city,birthday:f.birthday}}});
    if(error){$('#m').innerHTML=bad(error.message);return}
    let code='';if(data.session){await boot();const{data:pp}=await db.from('partners').select('code').eq('id',data.user.id).single();code=pp?.code||''}
    app.innerHTML=`<div class="done"><div class="tick">✓</div><h2>Registration successful!</h2><p>Welcome to the Casa Vanté Referral Network, ${e(f.name)}. ${data.session?'You are approved and your personal referral code is ready.':'Please check your email and click the confirmation link, then log in.'}</p>${code?`<p>Your referral code:</p><div class="tag" style="margin-bottom:1.2rem"><b>${e(code)}</b></div><br>`:''}${data.session?'<a class="btn" href="#dashboard">Go to my dashboard</a>':'<a class="btn" href="#login">Go to login</a>'}</div>`};
},
reset(){
  app.innerHTML=`<h2>Reset your password</h2><p>Enter your email and we will send you a link to choose a new password.</p><form id="f"><label>Email<input name="email" type="email" required></label><button>Send reset link</button></form><div id="m"></div>`;
  $('#f').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));
    const{error}=await db.auth.resetPasswordForEmail(f.email,{redirectTo:location.origin+location.pathname});
    $('#m').innerHTML=error?bad(error.message):ok('Done. If that email is registered, a reset link is on its way. Check your inbox and spam folder.')};
},
newpw(){
  if(!user){location.hash='login';return}
  app.innerHTML=`<h2>Choose a new password</h2><form id="f">${pw('pw','New password',6)}<button>Save new password</button></form><div id="m"></div>`;
  $('#f').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));
    const{error}=await db.auth.updateUser({password:f.pw});
    $('#m').innerHTML=error?bad(error.message):ok('Your password has been changed. <a href="#dashboard">Go to my dashboard</a>')};
},
login(){
  app.innerHTML=`<h2>Partner login</h2><form id="f"><label>Email<input name="email" type="email" required></label>${pw('pw','Password')}<button>Log in</button><a href="#reset">Forgot your password?</a></form><div id="m"></div>`;
  $('#f').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));
    const{error}=await db.auth.signInWithPassword({email:f.email,password:f.pw});
    if(error){const m=error.message||'';$('#m').innerHTML=bad(/invalid login/i.test(m)?'Wrong email or password.':/not confirmed/i.test(m)?'This email has not been confirmed yet. Please contact Casa Vanté or check your inbox.':m)}else{location.hash='dashboard';boot()}};
},
async dashboard(){
  if(isAdmin){location.hash='admin';return}
  if(!user){location.hash='login';return}
  let[{data:p,error:pe},{data:rs},{data:rw}]=await Promise.all([db.from('partners').select().eq('id',user.id).single(),
    db.from('referrals').select().order('created_at',{ascending:false}),db.from('partner_rewards').select().order('created_at',{ascending:false})]);
  if(pe&&pe.code!=='PGRST116'){app.innerHTML='<h2>Database not ready</h2>'+bad('Database error: '+pe.message);return}
  rs=rs||[];rw=rw||[];
  if(!p||(p.status!=='rejected'&&(p.status!=='approved'||!p.code))){const{data:h}=await db.rpc('ensure_partner');if(h&&h.id)p=h}
  if(!p||p.status!=='approved'){app.innerHTML=`<h2>Welcome, ${e(p?.name||'Partner')}</h2>`+(p?.status==='rejected'?bad('Your partner account has been closed.'+(p.reject_reason?' Reason: '+p.reject_reason+'.':'')+' Please contact Casa Vanté.'):ok('Your registration is waiting for approval. You will get your referral code as soon as Casa Vanté approves you.'));return}
  await banner();const ms=await milestones(),good=rs.filter(win).length,earned=rs.filter(r=>r.commission_status!=='none').reduce((a,r)=>a+Number(r.commission),0);
  const pend=rs.filter(r=>!['completed','not_proceeding'].includes(r.status)).length,next=ms.find(m=>m.needed>good),link=location.origin+location.pathname+'?ref='+p.code,wa='https://wa.me/?text='+encodeURIComponent('Need interior design, construction or repairs? Contact Casa Vanté through my link: '+link);
  app.innerHTML=`<h2>Welcome, ${e(p.name)}</h2>${AN?`<div class="msg"><b>Announcement:</b> ${e(AN)}</div>`:''}<p><a href="#newpw">Change my password</a></p>
  <div class="grid"><div class="box stat"><b>${rs.length}</b><span>Referrals</span></div><div class="box stat"><b>${good}</b><span>Successful</span></div>
  <div class="box stat"><b>${money(earned)}</b><span>Commission earned</span></div><div class="box stat"><b>${pend}</b><span>Pending referrals</span></div></div>
  <h3>My referral code</h3><div class="tag"><b>${e(p.code)}</b><button class="sm" onclick="cp('${e(p.code)}')">Copy code</button><button class="sm" onclick="cp('${e(link)}')">Copy link</button><a class="btn" style="padding:.3rem .6rem;font-size:.8rem" target="_blank" rel="noopener" href="${e(wa)}">Share on WhatsApp</a></div>
  <h3 style="margin-top:2rem">Rewards</h3>${next?`<p>${good} of ${next.needed} successful referrals for: ${e(next.reward)}</p><div class="bar"><i style="width:${Math.min(100,good/next.needed*100)}%"></i></div>`:'<p>You have reached every milestone.</p>'}
  <p>${rw.length?'Rewards given: '+rw.map(r=>e(r.reward)).join(', '):'No rewards given yet.'}</p>
  <h3 style="margin-top:2rem">My referrals</h3><div class="tw"><table><tr><th>Customer</th><th>Status</th><th>Commission</th></tr>
  ${rs.map(r=>`<tr><td>${e(r.customer_name)}</td><td>${LBL[r.status]}</td><td>${r.commission_status==='paid'?'<span class="ok">Paid '+money(r.commission)+'</span>':r.commission_status==='approved'?'<span class="owed">Approved '+money(r.commission)+', not yet paid</span>':'-'}</td></tr>`).join('')||'<tr><td colspan="3">No referrals yet. Submit your first one below.</td></tr>'}</table></div>
  <h3 style="margin-top:2rem">Submit a referral</h3><form id="f"><label>Customer name<input name="n" required></label><label>Customer phone<input name="p" type="tel" required></label><label>Notes (optional)<input name="x"></label><button>Submit referral</button></form><div id="m"></div>`;
  $('#f').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);
    const t=await db.rpc('phone_taken',{p:f.get('p')});if(t.data){$('#m').innerHTML=bad('This phone number has already been referred to Casa Vanté, so it cannot be submitted again.');return}
    const{error}=await db.from('referrals').insert({partner_id:user.id,customer_name:f.get('n'),customer_phone:f.get('p'),notes:f.get('x')});
    if(error)$('#m').innerHTML=bad(error.message);else V.dashboard()};
},
async admin(){
  if(!isAdmin){app.innerHTML=bad('This page is for Casa Vanté administrators.');return}await banner();
  const[{data:ps},{data:rs},{data:pay}]=await Promise.all([db.from('partners').select().order('created_at',{ascending:false}),
    db.from('referrals').select('*,partners(name,code)').order('created_at',{ascending:false}),db.from('payments').select('*,partners(name,code)').order('created_at',{ascending:false})]);
  REFS=rs;const ms=await milestones(),opts=Object.entries(LBL),cnt={};rs.forEach(r=>{const k=key(r.customer_phone);cnt[k]=(cnt[k]||0)+1});
  const row=p=>{const mine=rs.filter(r=>r.partner_id===p.id),g=mine.filter(win).length,earn=mine.filter(r=>r.commission_status!=='none').reduce((a,r)=>a+Number(r.commission),0),
    paid=pay.filter(x=>x.partner_id===p.id).reduce((a,x)=>a+Number(x.amount),0),owe=earn-paid,hit=[...ms].reverse().find(m=>g>=m.needed);if(UNPAID&&owe<=0)return'';
    return`<tr><td>${e(p.name)}<br><small>${e(p.phone)} · ${e(p.email)}</small></td><td>${p.status}<br><small>${e(p.code||'')}</small>${p.reject_reason?'<br><small>'+e(p.reject_reason)+'</small>':''}</td><td>${g}${hit?'<br><small>Reached: '+e(hit.reward)+'</small>':''}</td>
    <td>${money(earn)}</td><td>${money(paid)}</td><td class="${owe>0?'owed':'ok'}">${owe>0?'Not paid: '+money(owe):'Paid up'}</td>
    <td>${p.status==='rejected'?`<button class="sm" onclick="sp('${p.id}','approved')">Reinstate</button> `:`<button class="sm alt" onclick="rej('${p.id}')">Reject</button> `}
    ${p.status==='approved'?`<button class="sm alt" onclick="rwd('${p.id}')">Record reward</button>`:''}</td></tr>`};
  const owedAll=rs.filter(r=>r.commission_status==='approved').reduce((a,r)=>a+Number(r.commission),0),inprog=rs.filter(r=>!['completed','not_proceeding'].includes(r.status)).length;
  app.innerHTML=`<div class="admbar"><h2>Admin Dashboard</h2><p>Signed in as ${e(user.email)}</p></div>
  <div class="grid"><div class="box stat"><b>${ps.length}</b><span>Partners</span></div><div class="box stat"><b>${rs.length}</b><span>Referrals</span></div><div class="box stat"><b>${inprog}</b><span>In progress</span></div><div class="box stat"><b>${money(owedAll)}</b><span>Commission to pay</span></div></div>
  <h3>Announcement to all partners</h3><form onsubmit="return ann(event)" style="max-width:none;grid-template-columns:1fr auto"><input id="an" value="${e(AN)}" placeholder="For example: Double rewards on FIXERZ referrals this month"><button>Post</button></form><p><small>Leave it empty and press Post to remove the banner.</small></p>
  <label style="display:flex;gap:.5rem;align-items:center;font-weight:400;margin-top:1.5rem"><input type="checkbox" style="width:auto" ${UNPAID?'checked':''} onchange="UNPAID=this.checked;V.admin()">Show only unpaid balances</label><h3>Partners</h3><div class="tw"><table><tr><th>Partner</th><th>Status / code</th><th>Successful</th><th>Earned</th><th>Paid</th><th>Balance</th><th></th></tr>${ps.map(row).join('')}</table></div>
  <h3 style="margin-top:2rem">Referrals</h3><p><small>A referral counts once it is Completed and ticked as paid in full. Commission is ${RATE*100}% of the eligible fee (labour and service only).</small></p>
  <div class="tw"><table><tr><th>Customer</th><th>Partner</th><th>Status</th><th>Eligible fee (₦)</th><th>Paid in full</th><th>Commission</th><th>Note</th><th></th></tr>
  ${rs.filter(r=>!UNPAID||r.commission_status==='approved').map(r=>`<tr><td>${e(r.customer_name)}<br><small>${e(r.customer_phone)}</small>${cnt[key(r.customer_phone)]>1?'<br><span class="owed">Duplicate number</span>':''}</td><td>${e(r.partners?.code)}<br><small>${e(r.partners?.name)}</small></td>
  <td><select id="s${r.id}">${opts.map(([k,t])=>`<option value="${k}" ${k===r.status?'selected':''}>${t}</option>`).join('')}</select></td>
  <td><input id="f${r.id}" type="number" min="0" value="${r.service_fee}"></td><td><input id="p${r.id}" type="checkbox" ${r.paid_in_full?'checked':''} style="width:auto"></td>
  <td>${money(r.commission)}<br><small>${r.commission_status}</small></td><td><input id="n${r.id}" value="${e(r.admin_note)}"></td>
  <td><button class="sm" onclick="sv(${r.id})">Save</button>${r.commission_status==='approved'?` <button class="sm alt" onclick="pay(${r.id})">Record payment</button>`:''}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:2rem">Commission payment records</h3><div class="tw"><table><tr><th>Date</th><th>Partner</th><th>Amount</th><th>Note</th></tr>
  ${pay.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('en-NG')}</td><td>${e(x.partners?.name)} (${e(x.partners?.code)})</td><td>${money(x.amount)}</td><td>${e(x.note)}</td></tr>`).join('')||'<tr><td colspan="4">No payments recorded yet.</td></tr>'}</table></div>`;
}};
function clearAndReload(ev){ev.preventDefault();
  const d='expires=Thu, 01 Jan 1970 00:00:00 GMT',h=location.hostname.split('.');
  document.cookie.split(';').forEach(c=>{const n=c.split('=')[0].trim();if(!n)return;
    document.cookie=n+'=;'+d+';path=/';
    for(let i=0;i<h.length-1;i++)document.cookie=n+'=;'+d+';path=/;domain=.'+h.slice(i).join('.')});
  location.reload();return false}
function slider(){const s=$('#sl');if(!s)return;const im=[...s.querySelectorAll('img')],dt=[...s.querySelectorAll('.dots button')];let k=0;
  const go=n=>{k=(n+im.length)%im.length;im.forEach((x,i)=>x.classList.toggle('on',i===k));dt.forEach((x,i)=>x.classList.toggle('on',i===k))};
  dt.forEach((d,i)=>d.onclick=()=>go(i));clearInterval(window._sl);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)window._sl=setInterval(()=>$('#sl')?go(k+1):clearInterval(window._sl),4000)}
const cp=t=>navigator.clipboard.writeText(t).then(()=>alert('Copied'));
async function sp(id,status){await db.from('partners').update(status==='approved'?{status,reject_reason:null}:{status}).eq('id',id);V.admin()}
async function rej(id){const r=prompt('Reason for rejecting this partner (the partner will see it):');if(r===null)return;await db.from('partners').update({status:'rejected',reject_reason:r}).eq('id',id);V.admin()}
async function ann(ev){ev.preventDefault();await db.from('announcement').update({message:$('#an').value}).eq('id',1);V.admin();return false}
async function rwd(id){const reward=prompt('Reward or award given (for example: Partner of the Month, Birthday gift, VIP reward)');if(!reward)return;await db.from('partner_rewards').insert({partner_id:id,reward});V.admin()}
async function sv(id){const r=REFS.find(x=>x.id==id),status=$('#s'+id).value,fee=+$('#f'+id).value||0,paid=$('#p'+id).checked;
  const u={status,service_fee:fee,paid_in_full:paid,admin_note:$('#n'+id).value};
  if(status==='completed'&&paid&&r.commission_status==='none'){u.commission=Math.round(fee*RATE);u.commission_status='approved'}
  else if(r.commission_status==='approved')u.commission=Math.round(fee*RATE);
  const{error}=await db.from('referrals').update(u).eq('id',id);if(error)alert(error.message);V.admin()}
async function pay(id){const r=REFS.find(x=>x.id==id),note=prompt('Payment note (for example: bank transfer reference)','');if(note===null)return;
  await db.from('payments').insert({partner_id:r.partner_id,referral_id:id,amount:r.commission,note});
  await db.from('referrals').update({commission_status:'paid'}).eq('id',id);V.admin()}
boot();
</script>
</body>
